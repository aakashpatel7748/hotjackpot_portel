<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wf_bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e0c38"/>
      <stop offset="45%" stop-color="#120624"/>
      <stop offset="100%" stop-color="#07020e"/>
    </linearGradient>

    <!-- Radial Glow Behind Emblem -->
    <radialGradient id="wf_glow_bg" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#120624" stop-opacity="0"/>
    </radialGradient>

    <!-- 24K Gold Gradient for Wolf & Trim -->
    <linearGradient id="wf_gold" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Cyan Laser Eye Gradient -->
    <linearGradient id="wf_cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Magenta Accent Gradient -->
    <linearGradient id="wf_magenta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="wf_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Rich Background -->
  <rect width="160" height="160" fill="url(#wf_bg)"/>
  <rect width="160" height="160" fill="url(#wf_glow_bg)"/>

  <!-- Subtle Ambient Geometric Framing -->
  <circle cx="80" cy="56" r="46" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3"/>
  <circle cx="80" cy="56" r="40" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Geometric Golden Wolf Head (Centerpiece Emblem) -->
  <g id="wolf-emblem">
    <!-- Drop Shadow / Glow Silhouette -->
    <path d="M80 20 L94 36 L112 28 L104 52 L116 66 L98 72 L94 88 L80 78 L66 88 L62 72 L44 66 L56 52 L48 28 L66 36 Z" 
          fill="url(#wf_gold)" filter="url(#wf_glow)" opacity="0.3"/>

    <!-- Left Outer Ear & Jaw Plane -->
    <polygon points="80,22 66,38 48,30 56,54" fill="#d97706"/>
    <polygon points="56,54 44,68 62,74 66,90 80,80" fill="#b45309"/>

    <!-- Right Outer Ear & Jaw Plane -->
    <polygon points="80,22 94,38 112,30 104,54" fill="#f59e0b"/>
    <polygon points="104,54 116,68 98,74 94,90 80,80" fill="#d97706"/>

    <!-- Inner Ear Facets (Magenta & Dark Obsidian) -->
    <polygon points="66,38 74,48 58,50" fill="#ec4899" opacity="0.85"/>
    <polygon points="94,38 86,48 102,50" fill="#f472b6" opacity="0.85"/>

    <!-- Forehead & Brow Facets (Bright Reflective Gold) -->
    <polygon points="80,22 72,42 80,50 88,42" fill="#fffbeb"/>
    <polygon points="72,42 58,52 74,56 80,50" fill="#fde047"/>
    <polygon points="88,42 102,52 86,56 80,50" fill="#fef08a"/>

    <!-- Snout & Bridge -->
    <polygon points="80,50 74,56 75,70 80,74" fill="#d97706"/>
    <polygon points="80,50 86,56 85,70 80,74" fill="#f59e0b"/>

    <!-- Fierce Glowing Cyan Eyes -->
    <polygon points="68,54 75,55 71,58" fill="url(#wf_cyan)" filter="url(#wf_glow)"/>
    <polygon points="92,54 85,55 89,58" fill="url(#wf_cyan)" filter="url(#wf_glow)"/>

    <!-- Nose Tip & Lower Jaw -->
    <polygon points="77,71 83,71 80,76" fill="#180e2e"/>
    <polygon points="77,77 83,77 80,84" fill="#f59e0b"/>
  </g>

  <!-- Typography Banner Area -->
  <g id="brand-typography">
    <!-- "WILD" Text with Shadow -->
    <text x="80" y="118" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="24" 
          font-weight="900" 
          letter-spacing="2.5" 
          fill="#0a0512" 
          text-anchor="middle"
          stroke="#0a0512" 
          stroke-width="3">
      WILD
    </text>
    <text x="80" y="118" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="24" 
          font-weight="900" 
          letter-spacing="2.5" 
          fill="#ffffff" 
          text-anchor="middle">
      WILD
    </text>

    <!-- "FORTUNE" Subtext with Golden Metallic Gradient -->
    <text x="80" y="139" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="11.5" 
          font-weight="800" 
          letter-spacing="4" 
          fill="url(#wf_gold)" 
          text-anchor="middle">
      FORTUNE
    </text>
  </g>

  <!-- Top Accent Coin Sparkle -->
  <circle cx="80" cy="18" r="2.5" fill="#fde047"/>
  <circle cx="80" cy="18" r="4.5" stroke="#fde047" stroke-width="0.75" stroke-opacity="0.6"/>
</svg>
