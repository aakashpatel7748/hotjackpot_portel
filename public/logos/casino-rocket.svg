<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Cosmic Space Gradient -->
    <linearGradient id="cr_bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19073b"/>
      <stop offset="50%" stop-color="#0c0321"/>
      <stop offset="100%" stop-color="#04010a"/>
    </linearGradient>

    <!-- Nebula Glow Behind Rocket -->
    <radialGradient id="cr_nebula" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0c0321" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Rocket Hull Gradient -->
    <linearGradient id="cr_hull" x1="30" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Jet Thruster Fire Gradient -->
    <linearGradient id="cr_fire" x1="0" y1="0" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="75%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Neon Wings Gradient -->
    <linearGradient id="cr_neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Cyan Energy Orbit -->
    <linearGradient id="cr_cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="cr_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Deep Space Background -->
  <rect width="160" height="160" fill="url(#cr_bg)"/>
  <rect width="160" height="160" fill="url(#cr_nebula)"/>

  <!-- Orbital Ring & Stars Atmosphere -->
  <ellipse cx="80" cy="52" rx="46" ry="18" stroke="url(#cr_cyan)" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(-18 80 52)"/>
  
  <!-- Ambient Space Stars -->
  <circle cx="28" cy="32" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="134" cy="28" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="26" cy="88" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="138" cy="80" r="1.8" fill="#f472b6" opacity="0.85"/>

  <!-- 4-Point Sparkling Star -->
  <path d="M125 45 Q125 50 130 50 Q125 50 125 55 Q125 50 120 50 Q125 50 125 45 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Rocket Group - Centered, Powerful, Vertically Balanced -->
  <g id="rocket" transform="translate(80, 52)">
    <!-- Exhaust Plasma Flame with Glow -->
    <path d="M-8 18 Q0 48 0 54 Q0 48 8 18 Z" fill="url(#cr_fire)" filter="url(#cr_glow)"/>
    <path d="M-4 18 Q0 38 0 42 Q0 38 4 18 Z" fill="#fef08a"/>
    <path d="M-2 18 Q0 28 0 30 Q0 28 2 18 Z" fill="#ffffff"/>

    <!-- Left Wing Fin -->
    <path d="M-11 6 L-24 22 L-10 20 Z" fill="url(#cr_neon)"/>
    <path d="M-10 6 L-21 21 L-10 20 Z" fill="#ffffff" opacity="0.2"/>

    <!-- Right Wing Fin -->
    <path d="M11 6 L24 22 L10 20 Z" fill="url(#cr_neon)"/>
    <path d="M10 6 L21 21 L10 20 Z" fill="#ffffff" opacity="0.2"/>

    <!-- Center Stabilizer Fin Base -->
    <path d="M-2 12 L0 22 L2 12 Z" fill="#7e22ce"/>

    <!-- Rocket Fuselage Body -->
    <path d="M0 -34 C14 -18 14 10 11 19 L-11 19 C-14 10 -14 -18 0 -34 Z" fill="url(#cr_hull)"/>

    <!-- Red / Magenta Nose Cone Cap -->
    <path d="M0 -34 C6 -26 8 -18 8 -13 L-8 -13 C-8 -18 -6 -26 0 -34 Z" fill="#ec4899"/>
    
    <!-- Fuselage Highlight (Gloss Reflection) -->
    <path d="M-7 -10 C-6 -22 -1 -30 0 -33 C-4 -26 -6 -15 -6 -8 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Cockpit Porthole Window with Glass Rim -->
    <circle cx="0" cy="-2" r="6.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="-2" r="4.2" fill="#0284c7"/>
    <!-- Glass Reflection in Porthole -->
    <circle cx="1.8" cy="-3.8" r="1.5" fill="#ffffff"/>
  </g>

  <!-- High-Contrast Typography Banner -->
  <g id="brand-typography">
    <!-- "CASINO" Header with Neon Purple Hue -->
    <text x="80" y="116" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="11.5" 
          font-weight="800" 
          letter-spacing="4.5" 
          fill="#c084fc" 
          text-anchor="middle">
      CASINO
    </text>

    <!-- "ROCKET" Main Name in Bold Italic Futuristic Cut -->
    <text x="80" y="140" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="22" 
          font-weight="900" 
          letter-spacing="2.5" 
          fill="#05020c" 
          text-anchor="middle"
          stroke="#05020c" 
          stroke-width="3">
      ROCKET
    </text>
    <text x="80" y="140" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="22" 
          font-weight="900" 
          letter-spacing="2.5" 
          fill="#ffffff" 
          text-anchor="middle">
      ROCKET
    </text>
  </g>
</svg>
