<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Emerald & Obsidian Luxury Background -->
    <linearGradient id="rz_bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1a13"/>
      <stop offset="50%" stop-color="#06100c"/>
      <stop offset="100%" stop-color="#020604"/>
    </linearGradient>

    <!-- Warm Champagne Gold Radial Spotlight -->
    <radialGradient id="rz_spotlight" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#06100c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020604" stop-opacity="0"/>
    </radialGradient>

    <!-- 24K Luxury Gold Metallic Gradient -->
    <linearGradient id="rz_gold" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Platinum Champagne Highlight -->
    <linearGradient id="rz_champagne" x1="40" y1="20" x2="120" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="rz_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Opulent Background -->
  <rect width="160" height="160" fill="url(#rz_bg)"/>
  <rect width="160" height="160" fill="url(#rz_spotlight)"/>

  <!-- Art Deco Subtle Diamond Sunburst Framing -->
  <polygon points="80,14 146,80 80,146 14,80" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.25"/>
  <circle cx="80" cy="54" r="44" fill="none" stroke="#ca8a04" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="2 4"/>

  <!-- Royal Art Deco Crown & Monogram Emblem -->
  <g id="crown-emblem" transform="translate(80, 52)">
    <!-- Crown Ambient Glow Base -->
    <path d="M-32 -6 L-40 -26 L-20 -15 L0 -34 L20 -15 L40 -26 L32 -6 Z" 
          fill="url(#rz_gold)" filter="url(#rz_glow)" opacity="0.35"/>

    <!-- 5-Point Crown Main Structure -->
    <path d="M-30 -4 L-38 -24 L-19 -14 L0 -32 L19 -14 L38 -24 L30 -4 Z" 
          fill="url(#rz_gold)"/>

    <!-- Crown Peaks Jewel Settings -->
    <circle cx="-38" cy="-24" r="3" fill="#fef08a"/>
    <circle cx="-19" cy="-14" r="2.5" fill="#fef08a"/>
    <circle cx="0" cy="-32" r="3.5" fill="#ffffff" filter="url(#rz_glow)"/>
    <circle cx="19" cy="-14" r="2.5" fill="#fef08a"/>
    <circle cx="38" cy="-24" r="3" fill="#fef08a"/>

    <!-- Facet Inner Shading Lines -->
    <path d="M0 -32 L0 -4 M-19 -14 L-15 -4 M19 -14 L15 -4" stroke="#78350f" stroke-width="1.2" opacity="0.7"/>

    <!-- Crown Base Band with Gemstones -->
    <rect x="-30" y="-4" width="60" height="7" rx="2" fill="url(#rz_champagne)"/>
    
    <!-- Royal Ruby & Sapphire Inset Cabochons -->
    <circle cx="-20" cy="-0.5" r="1.8" fill="#e11d48"/>
    <circle cx="-10" cy="-0.5" r="1.8" fill="#10b981"/>
    <circle cx="0" cy="-0.5" r="2.2" fill="#ffffff"/>
    <circle cx="10" cy="-0.5" r="1.8" fill="#10b981"/>
    <circle cx="20" cy="-0.5" r="1.8" fill="#e11d48"/>

    <!-- Majestic Art Deco 'R' Monogram Plaque -->
    <path d="M-12 11 L-12 30" stroke="url(#rz_champagne)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-12 11 L2 11 C8 11 11 14 11 18 C11 22 8 24 2 24 L-12 24" stroke="url(#rz_champagne)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2 24 L11 30" stroke="url(#rz_champagne)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="11" cy="30" r="1.5" fill="#fde047"/>
  </g>

  <!-- Typography Banner Area -->
  <g id="brand-typography">
    <!-- "RITZO" Serif Brand Typography with Rich Gold Leaf Fill -->
    <text x="80" y="119" 
          font-family="'Playfair Display', 'Cinzel', Georgia, 'Times New Roman', serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="3.5" 
          fill="#020604" 
          text-anchor="middle"
          stroke="#020604" 
          stroke-width="3.5">
      RITZO
    </text>
    <text x="80" y="119" 
          font-family="'Playfair Display', 'Cinzel', Georgia, 'Times New Roman', serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="3.5" 
          fill="url(#rz_champagne)" 
          text-anchor="middle">
      RITZO
    </text>

    <!-- "CASINO" Art Deco Spaced Subtitle -->
    <text x="80" y="139" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="10.5" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#94a3b8" 
          text-anchor="middle">
      CASINO
    </text>
  </g>

  <!-- Top Center Star -->
  <polygon points="80,10 82,14 86,16 82,18 80,22 78,18 74,16 78,14" fill="#fde047"/>
</svg>
