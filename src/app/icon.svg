<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hj_bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241042"/>
      <stop offset="60%" stop-color="#120624"/>
      <stop offset="100%" stop-color="#07020e"/>
    </linearGradient>
    <linearGradient id="hj_gold" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="hj_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#hj_bg)" stroke="url(#hj_gold)" stroke-width="4"/>
  <circle cx="64" cy="64" r="54" fill="url(#hj_glow)"/>

  <!-- Blazing Flame Spark at Top -->
  <path d="M64 16 Q68 26 64 32 Q60 26 64 16 Z" fill="#ef4444"/>
  <path d="M64 20 Q66 26 64 30 Q62 26 64 20 Z" fill="#fef08a"/>

  <!-- Royal 5-Point Crown Emblem -->
  <g transform="translate(64, 66)">
    <!-- Crown Body -->
    <path d="M-36 12 L-42 -12 L-20 -2 L0 -24 L20 -2 L42 -12 L36 12 Z" fill="url(#hj_gold)"/>
    
    <!-- Crown Peaks Jewels -->
    <circle cx="-42" cy="-12" r="3.5" fill="#fef08a"/>
    <circle cx="-20" cy="-2" r="3" fill="#fef08a"/>
    <circle cx="0" cy="-24" r="4.5" fill="#ffffff"/>
    <circle cx="20" cy="-2" r="3" fill="#fef08a"/>
    <circle cx="42" cy="-12" r="3.5" fill="#fef08a"/>

    <!-- Base Crown Band -->
    <rect x="-36" y="12" width="72" height="9" rx="3" fill="#fde047"/>
    <circle cx="-24" cy="16.5" r="2.2" fill="#e11d48"/>
    <circle cx="-12" cy="16.5" r="2.2" fill="#10b981"/>
    <circle cx="0" cy="16.5" r="2.5" fill="#ffffff"/>
    <circle cx="12" cy="16.5" r="2.2" fill="#10b981"/>
    <circle cx="24" cy="16.5" r="2.2" fill="#e11d48"/>

    <!-- Central Diamond Plaque -->
    <polygon points="0,-10 10,-2 0,6 -10,-2" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>

